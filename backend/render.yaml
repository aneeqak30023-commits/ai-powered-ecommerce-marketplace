services:
  - type: web
    name: nexmart-backend
    runtime: node
    plan: starter
    buildCommand: |
      npm ci
      cp prisma/schema.production.prisma prisma/schema.prisma
      rm -rf prisma/migrations
      cp -r prisma/migrations-postgres prisma/migrations
      printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"' > prisma/migrations/migration_lock.toml
      npx prisma generate
    startCommand: "npx prisma migrate deploy && npm start"
    seedCommand: "node src/scripts/seed-production.js"
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: nexmart-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SAFEPAY_PUBLIC_KEY
        sync: false
      - key: SAFEPAY_SECRET_KEY
        sync: false
      - key: SAFEPAY_WEBHOOK_SECRET
        sync: false
      - key: SAFEPAY_API_BASE_URL
        sync: false

databases:
  - name: nexmart-postgres
    region: oregon
    plan: starter
